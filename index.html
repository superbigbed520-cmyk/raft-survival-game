<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>木筏生存 3D</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }
        canvas { display:block; }
        #ui { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
        #ui > * { pointer-events:auto; }

        /* HUD */
        .hud-bar { position:fixed; top:12px; left:12px; background:rgba(0,0,0,0.6); border-radius:8px; padding:10px 14px; min-width:180px; }
        .stat { display:flex; align-items:center; gap:8px; margin:4px 0; }
        .stat-icon { font-size:16px; width:22px; }
        .bar-bg { flex:1; height:14px; background:rgba(255,255,255,0.15); border-radius:7px; overflow:hidden; }
        .bar-fill { height:100%; border-radius:7px; transition:width 0.3s; }
        .bar-label { font-size:11px; color:#fff; min-width:30px; text-align:right; }

        .time-display { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.6); border-radius:8px; padding:6px 18px; color:#fff; font-size:15px; }

        /* 快捷栏 */
        .hotbar { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:5px; background:rgba(0,0,0,0.7); padding:8px 10px; border-radius:10px; }
        .slot { width:52px; height:52px; background:#2c3e50; border:2px solid #555; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; cursor:pointer; }
        .slot.selected { border-color:#fff; background:#2980b9; }
        .slot-icon { font-size:22px; }
        .slot-count { position:absolute; bottom:2px; right:4px; font-size:11px; font-weight:bold; color:#fff; }
        .slot-key { position:absolute; top:2px; left:4px; font-size:9px; color:#888; }

        /* 提示 */
        .toast-box { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; }
        .toast { background:rgba(0,0,0,0.75); color:#fff; padding:6px 18px; border-radius:6px; font-size:13px; animation:fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        /* 操作提示 */
        .controls { position:fixed; bottom:80px; left:12px; background:rgba(0,0,0,0.55); border-radius:6px; padding:6px 10px; color:#ccc; font-size:11px; line-height:1.5; }

        /* 全屏面板 */
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:20; }
        .panel { background:#2c3e50; border-radius:12px; padding:24px 28px; color:#ecf0f1; min-width:340px; max-width:560px; max-height:80vh; overflow-y:auto; }
        .panel h2 { text-align:center; margin-bottom:16px; font-size:22px; }
        .panel .row { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; margin:4px 0; background:#34495e; border-radius:8px; cursor:pointer; }
        .panel .row:hover { background:#3d566e; }
        .panel .row.active { background:#2980b9; }
        .panel .hint { text-align:center; color:#888; font-size:12px; margin-top:14px; }

        /* 合成 */
        .recipe { display:flex; align-items:center; gap:12px; padding:10px; margin:5px 0; background:#34495e; border-radius:8px; }
        .recipe.can { background:#27ae60; }
        .recipe-icon { font-size:28px; width:40px; text-align:center; }
        .recipe-info { flex:1; }
        .recipe-name { font-weight:bold; font-size:14px; }
        .recipe-desc { font-size:11px; color:#bbb; }
        .recipe-need { font-size:11px; color:#ddd; margin-top:2px; }
        .recipe-btn { background:#2ecc71; border:none; color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; }
        .recipe-btn:disabled { background:#666; cursor:default; }
        .cat-tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
        .cat-tab { padding:5px 14px; border-radius:6px; background:#555; color:#fff; cursor:pointer; font-size:13px; }
        .cat-tab.active { background:#2980b9; }
    </style>
</head>
<body>
    <div id="ui"></div>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
